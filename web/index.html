<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No network, ever. The panel is a local document with an inlined bundle, so
         even a compromised diff payload has nowhere to send anything. 'unsafe-inline'
         is required because the bundle IS inline; there is no remote origin to
         allow, which is the property that matters. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Mind2t panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
