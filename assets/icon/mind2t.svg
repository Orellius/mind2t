<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Mind2t - the app mark. REDRAWN 2026-08-08 on Orel's word: "change the icon, create an icon
    with 'M2T'". It replaces a cabinet-maker's screwdriver, which was drawn for the product's
    previous reading as a workshop and stopped describing a terminal the day the workbench was
    parked.

    THE GLYPHS ARE DRAWN ON A COARSE GRID, ON PURPOSE, and that is the whole design argument.
    Three characters in one icon is one more than this mark has ever survived - the note in
    CLAUDE.md says two elements is the ceiling, learned across four attempts that died at 32
    pixels. What makes three viable is refusing curves: every stroke here is axis-aligned and 80
    design units wide, which is 2.5 device pixels at 32, and a rectangle at 2.5px is still a
    rectangle. A drawn '2' with a bowl and a tail is not - it turns to porridge, which is exactly
    how the earlier rounded attempts failed.

    It is also the honest mark for this product. A terminal draws glyphs on a cell grid; the icon
    is the product's own rasteriser applied to its own name. The '2' is a seven-segment form (the
    a, b, g, e and d segments) for the same reason.

    LAYOUT, stated so a later edit does not have to re-derive it. Content box x 112..912,
    y 300..724. Three cells 240 wide with 40 between them: 240*3 + 40*2 = 800. Cap height 424,
    which is 41 percent of the canvas - large enough that each glyph owns about 8 device pixels
    at 32, and any smaller was unreadable when measured.

    COLOUR is the terminal's own, from crates/render/src/color.rs: ground #0d0d0d
    (default_background) over the same #1c1c1c gradient the previous mark used, ink #ffffff
    (default_foreground), and the '2' in #f0c674, palette index 3. The accent is on the middle
    glyph deliberately - at 32 pixels a colour difference survives where a shape difference does
    not, so the three characters keep their rhythm even when the strokes start to blur.

    Regenerate BOTH raster copies after any edit; nothing does it automatically:
      rsvg-convert -w 1024 -h 1024 assets/icon/mind2t.svg -o assets/icon/mind2t-1024.png
      cp assets/icon/mind2t-1024.png crates/mind2t/icons/icon.png
    And judge the result at 32, which is what the Dock draws:
      rsvg-convert -w 32 assets/icon/mind2t.svg | magick - -filter point -resize 900% out.png
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#ground)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" ry="199"
        fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!--
    M, cell x 112..352. One filled outline rather than three shapes, so the V notch cannot drift
    away from the two stems. The notch bottoms at y 560, well above the baseline: a deep V eats
    the middle of the glyph and at 32 pixels an M with a deep notch reads as two separate bars.
  -->
  <path d="M112 724 L112 300 L192 300 L232 430 L272 300 L352 300 L352 724
           L272 724 L272 470 L232 560 L192 470 L192 724 Z" fill="#ffffff"/>

  <!--
    2, cell x 392..632, seven-segment: top, upper-right, middle, lower-left, bottom. Five
    rectangles and no curve anywhere. The verticals overlap the horizontals by a full stroke, so
    the corners are solid rather than mitred - a mitre is sub-pixel detail at 32 and reads as a
    notch.

    Two things here were measured at 32 rather than reasoned about, and the first render had both
    wrong:
    - THE GAPS MUST BE EQUAL. They were 52 units above the middle bar and 132 below, and at 32
      pixels 52 units is 1.6 device pixels - the top bar and the middle bar fused into one block
      and the glyph became a solid amber slab with a notch. The three bars now sit at 300, 472
      and 644 with 92 units of air on both sides of the middle one, which is 2.9 pixels.
    - THE TOP BAR IS INSET 40 UNITS ON THE LEFT, and that inset is what stops it reading as a Z.
      A seven-segment 2 and a Z are otherwise the same five strokes; a real 2 begins its top
      stroke to the right of its left edge because that stroke is the start of a curve. The
      bottom bar stays full width, which is the other half of the distinction.
  -->
  <g fill="#f0c674">
    <rect x="432" y="300" width="200" height="80"/>
    <rect x="552" y="300" width="80" height="252"/>
    <rect x="392" y="472" width="240" height="80"/>
    <rect x="392" y="472" width="80" height="252"/>
    <rect x="392" y="644" width="240" height="80"/>
  </g>

  <!--
    T, cell x 672..912. The stem is centred on the cell and the arms are symmetric, because an
    asymmetric T is the one letter people notice immediately even when they cannot say why.
  -->
  <g fill="#ffffff">
    <rect x="672" y="300" width="240" height="80"/>
    <rect x="752" y="380" width="80" height="344"/>
  </g>
</svg>
