<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Sadna (סדנה, workshop) - the app mark. 2026-08-06.

    WHAT IT IS: a prompt, pointing the other way. A chevron aimed LEFT with the block cursor
    sitting to its left, which is where a cursor sits on a right-to-left line. Every terminal
    icon in the Dock is a `>` and a block; this one is the mirror of that, and the mirror is
    the whole product claim - Ghostty has no bidi at all, and Hebrew is why this exists.

    WHY NOT THE LETTER. The version before this drew ס (samekh, the first letter of סדנה) as a
    rounded ring with the caret in its counter. Rendered at 32 it did not read as a Hebrew
    letter to anyone who was not told; it read as a record button. A mark that needs a caption
    has failed, so the letter is gone and the direction carries the meaning instead.

    THE COLOURS ARE THE PRODUCT'S OWN, measured from `crates/render/src/color.rs`: ground
    #0d0d0d and ink #ffffff, the operator's 2026-07-29 call of "near-black ground, pure white
    ink, the sixteen stay vivid". The cursor is #f0c674, palette index 3 of that same scheme.
    The first mark used a blue-grey plate and an amber caret, which belonged to no theme this
    terminal ships.

    JUDGE IT AT 32 PIXELS - the size the Dock and the switcher actually draw, and the size at
    which the previous two attempts failed. The chevron stroke is 104/1024, a little over three
    device pixels there; the cursor is 152 wide so it stays a block rather than a speck. The GAP between the
    cursor and the chevron is 128 units, four device pixels at 32 - the first attempt left 44 and
    the two shapes fused into one blob shaped like a bowtie.
  -->
  <defs>
    <!-- The terminal's own ground, lifted at the top so the plate has a light source without
         becoming a different colour. -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <!-- The hairline every macOS icon carries: bright at the top, gone by the middle. Without
         it the plate has no edge against a dark Dock. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e2e2"/>
    </linearGradient>
  </defs>

  <!-- The plate. macOS masks its own corners on the iconset, so this radius only matters where
       the mark is shown unmasked - which the README and the release page both do. -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#ground)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" ry="199"
        fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!--
    The chevron, aimed left. Drawn as a stroked polyline with round joins so it keeps its weight
    when the whole mark is downsampled; a filled arrowhead goes muddy at 32 because its point is
    thinner than a pixel.
  -->
  <polyline points="708,342 508,512 708,682"
            fill="none" stroke="url(#ink)" stroke-width="98"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!--
    The block cursor, LEFT of the chevron - the position that only makes sense on an RTL line,
    and the entire point of the mark. Cell-shaped rather than square, so it reads as a terminal
    cursor and not as a bullet.
  -->
  <rect x="228" y="436" width="152" height="152" rx="18" ry="18" fill="#f0c674"/>
</svg>
