# Differential corpus: byte streams fed identically to libghostty-vt and to ruuah-vt.
#
# `expect` is the verdict the case is asserted to produce today, not the verdict it
# should eventually produce. A `diff` case is a to-do list entry: when ruuah-vt implements
# the behaviour, this file fails and the case gets promoted to `match`. That is the
# point -- the harness is only evidence if it can be wrong.
#
# `bytes` is a TOML basic string, so control characters use TOML escapes.
# ESC is \u001B.

# ---------------------------------------------------------------------------
# Expected to MATCH. These are what the slice 0 stub already implements, and they
# prove the harness can detect agreement rather than only ever crying difference.
# ---------------------------------------------------------------------------

[[case]]
name = "empty-stream"
expect = "match"
bytes = ""
note = "A terminal that has been written nothing agrees on geometry, cursor and blankness."

[[case]]
name = "plain-ascii"
expect = "match"
bytes = "hello world"
note = "Printable ASCII lands in cells and advances the cursor."

[[case]]
name = "plain-multiline"
expect = "match"
bytes = "one\r\ntwo\r\nthree"
note = "CR and LF move the cursor without erasing, while there is room below."

[[case]]
name = "backspace-overwrite"
expect = "match"
bytes = "abc\b\bX"
note = "BS moves left and the next print overwrites in place."

# ---------------------------------------------------------------------------
# Expected to DIFF. Everything the stub does not implement. Each one is a slice
# ahead, and the reported paths are the specification for that slice.
# ---------------------------------------------------------------------------

[[case]]
name = "sgr-bold"
expect = "match"
bytes = "a\u001B[1mB\u001B[0mc"
note = "Slice 1: SGR sets and clears attributes on the cells written while active."

[[case]]
name = "sgr-colours"
expect = "match"
bytes = "\u001B[31mred\u001B[38;2;10;20;30mrgb"
note = "Slice 1: palette and direct-RGB foreground, semicolon form."

[[case]]
name = "cursor-position"
expect = "match"
bytes = "\u001B[3;5Hx"
note = "Slice 1: CUP absolute cursor movement."

[[case]]
name = "autowrap-phantom"
expect = "match"
cols = 5
rows = 3
bytes = "abcdef"
note = "Slice 2: the DEC phantom state -- the last column defers its wrap until the next printable."

[[case]]
name = "wide-character"
expect = "match"
bytes = "世界x"
note = "Slice 1: a wide cell claims two columns and leaves a spacer tail."

[[case]]
name = "combining-mark"
expect = "match"
bytes = "é!"
note = "Slice 1: a grapheme cluster stays in one cell; ranked failure mode 2."

[[case]]
name = "erase-in-line"
expect = "match"
bytes = "abcdef\u001B[2K"
note = "Slice 2: EL, painting with the current background (BCE)."

[[case]]
name = "alternate-screen"
expect = "match"
bytes = "\u001B[?1049h"
note = "Slice 2: the alternate screen is a separate buffer with its own cursor."

[[case]]
name = "scroll-past-bottom"
expect = "match"
cols = 10
rows = 3
bytes = "1\r\n2\r\n3\r\n4\r\n5"
note = "Slice 2: writing past the last row scrolls the region."

# ---------------------------------------------------------------------------
# Slice 1 additions. The gate is "diffs clean against the oracle on plain
# output", so these push echo, SGR and cursor movement harder than the
# originals did.
# ---------------------------------------------------------------------------

[[case]]
name = "sgr-attribute-mix"
expect = "match"
bytes = "\u001B[1;3;4;9;53mA\u001B[22;23;24;29;55mB"
note = "Attributes set together, then cleared individually."

[[case]]
name = "sgr-rgb-colon-form"
expect = "match"
bytes = "\u001B[38:2:200:100:50m\u001B[48:5:17mX"
note = "The colon sub-parameter colour form, which coexists with the semicolon form."

[[case]]
name = "sgr-underline-styles"
expect = "match"
bytes = "\u001B[4:3m\u001B[58;5;9mcurly\u001B[59m\u001B[4:0m."
note = "Curly underline plus a separate underline colour, then both cleared."

[[case]]
name = "sgr-colour-then-attribute"
expect = "match"
bytes = "\u001B[38;5;200;1mX"
note = "An indexed colour must not swallow the SGR parameter that follows it."

[[case]]
name = "sgr-pen-survives-newline"
expect = "match"
bytes = "\u001B[31mred\r\nstill red"
note = "The pen is terminal state, not per-line state."

[[case]]
name = "cursor-relative-moves"
expect = "match"
bytes = "abc\u001B[2D\u001B[BX\u001B[2A\u001B[CY"
note = "CUB, CUD, CUU and CUF interleaved with printing."

[[case]]
name = "cursor-column-and-row"
expect = "match"
bytes = "\u001B[5Ga\u001B[3db\u001B[1;1Hc"
note = "CHA, VPA and CUP absolute addressing."

[[case]]
name = "cjk-mixed-width"
expect = "match"
bytes = "a\u4E16b\u754Cc"
note = "Wide cells interleaved with narrow ones; the cursor must advance by width."

[[case]]
name = "emoji-zwj-sequence"
expect = "match"
bytes = "\U0001F468\u200D\U0001F469\u200D\U0001F467!"
note = "Verified 2026-07-28: DEC mode 2027 (grapheme cluster) is off by default, so Ghostty splits a ZWJ family emoji across cells exactly as the zero-width heuristic does. The heuristic is correct for default mode; full UAX #29 segmentation is only needed once mode 2027 is implemented, which is slice 2."

# ---------------------------------------------------------------------------
# Not built. Slice 2 closed every previous gap, and a corpus where nothing
# differs cannot demonstrate that the harness detects disagreement -- so these
# keep the other direction alive AND double as the specification for what is
# next. Each one is a real, named omission, not a synthetic failure.
# ---------------------------------------------------------------------------

[[case]]
name = "decaln-alignment-test"
expect = "diff"
bytes = "\u001B#8"
note = "DECALN fills the screen with E. Sequences carrying a # intermediate are not dispatched."

[[case]]
name = "selective-erase"
expect = "diff"
bytes = "abcdef\u001B[?1K"
note = "DECSED/DECSEL respect the protection attribute. Private erase variants are not dispatched."

[[case]]
name = "repeat-character"
expect = "diff"
bytes = "x\u001B[4b"
note = "REP repeats the last graphic character. Not implemented."

[[case]]
name = "insert-replace-mode"
expect = "diff"
bytes = "abcdef\u001B[1G\u001B[4hXY"
note = "IRM makes printing insert rather than overwrite. Not implemented."

[[case]]
name = "grapheme-cluster-mode-2027"
expect = "diff"
bytes = "\u001B[?2027h\U0001F468\u200D\U0001F469\u200D\U0001F467!"
note = "With mode 2027 on, a ZWJ sequence is one cluster in one cell. The zero-width heuristic cannot do this; it needs real UAX #29 incremental segmentation."

[[case]]
name = "reverse-wraparound"
expect = "diff"
cols = 6
rows = 3
bytes = "\u001B[?45habcdefgh\u001B[1G\u0008"
note = "Mode 45 lets backspace at column 0 wrap to the end of the previous row. Ghostty has it (modes.zig: reverse_wrap = 45); not implemented here. The first version of this case backspaced on row 0, where there is no previous row, so both sides agreed and it proved nothing."

# ---------------------------------------------------------------------------
# Slice 3: scrollback. Every case here stays far under the point where either
# side prunes -- Ghostty's limit is a memory budget scaled by width (measured
# 2026-07-28: 3000 lines kept 2998 at 6 columns but only 634 at 80), while
# this core's is a row count, so the prune POLICIES are not comparable. Their
# CONTENTS are, and that is what these check. Prune policy is unit-tested in
# history.rs instead.
# ---------------------------------------------------------------------------

[[case]]
name = "scrollback-basic"
expect = "match"
cols = 10
rows = 3
scrollback = 50
bytes = "l1\r\nl2\r\nl3\r\nl4\r\nl5\r\nl6\r\nl7"
note = "Rows scrolled off the top land in history, oldest first."

[[case]]
name = "scrollback-none-without-budget"
expect = "match"
cols = 10
rows = 3
bytes = "l1\r\nl2\r\nl3\r\nl4\r\nl5"
note = "With no budget the same stream keeps no history at all. Guards the default."

[[case]]
name = "scrollback-styles-survive"
expect = "match"
cols = 10
rows = 2
scrollback = 50
bytes = "\u001B[31mred\r\n\u001B[1;42mboldgreen\r\nplain\r\nlast"
note = "A row keeps its styles across the move into a page, which re-interns them into the page's own table."

[[case]]
name = "scrollback-wrapped-line"
expect = "match"
cols = 6
rows = 2
scrollback = 50
bytes = "abcdefghijkl\r\nx\r\ny\r\nz"
note = "Soft-wrap flags must survive into history, or slice 4 cannot rejoin the logical line."

[[case]]
name = "scrollback-graphemes"
expect = "match"
cols = 8
rows = 2
scrollback = 50
bytes = "e\u0301\u4E16!\r\nsecond\r\nthird\r\nfourth"
note = "Combining marks and wide cells survive the move into a page."

[[case]]
name = "scrollback-erased-background"
expect = "match"
cols = 8
rows = 2
scrollback = 50
bytes = "\u001B[41m\u001B[2Kfilled\r\nb\r\nc\r\nd"
note = "A background-only cell keeps its colour in history. This is the case that would have passed silently before the oracle learned to read bg-colour cells."

[[case]]
name = "scrollback-alt-screen-has-none"
expect = "match"
cols = 10
rows = 2
scrollback = 50
bytes = "keep\r\nme\r\n\u001B[?1049ha\r\nb\r\nc\r\nd"
note = "The alternate screen has no scrollback by protocol; its scrolled rows are discarded."

[[case]]
name = "scrollback-scroll-region-does-not-feed-history"
expect = "match"
cols = 10
rows = 5
scrollback = 50
bytes = "a\r\nb\r\nc\r\nd\r\ne\u001B[2;4r\u001B[4;1Hx\r\ny\r\nz"
note = "A region that does not start at the top of the screen pushes rows out inside the screen, not off it. Those must not become history."

[[case]]
name = "reflow-narrow-rejoins-and-resplits"
expect = "match"
cols = 10
rows = 4
bytes = "abcdefghijklmno"
resize = { cols = 5, rows = 4 }
note = "The slice in one case: a soft-wrapped line rejoins into one logical line and re-splits at the new width."

[[case]]
name = "reflow-widen-rejoins-the-rows"
expect = "match"
cols = 5
rows = 4
bytes = "abcdefghijklmno"
resize = { cols = 10, rows = 4 }
note = "The same line widened. Three rows become two, and the deferred wrap is carried verbatim."

[[case]]
name = "reflow-cursor-lands-past-the-content"
expect = "match"
cols = 10
rows = 3
bytes = "hi\r\nthere"
resize = { cols = 5, rows = 3 }
note = "The cursor sat one cell past the text, so the line extends by an empty continuation row to give that cell a home. Trailing blanks on the OTHER line are trimmed instead."

[[case]]
name = "reflow-write-through-the-cursor-narrowed"
expect = "match"
cols = 10
rows = 4
bytes = "abcdefghijklmno"
resize = { cols = 5, rows = 4 }
after = "XY"
note = "Where the cursor ended up, made observable: a grid comparison cannot see a cursor that never writes."

[[case]]
name = "reflow-write-through-the-cursor-widened"
expect = "match"
cols = 5
rows = 4
bytes = "abcdefghijklmno"
resize = { cols = 10, rows = 4 }
after = "XY"
note = "The same widening. Also pins that a deferred wrap resolved away from the last column moves down WITHOUT marking a soft wrap."

[[case]]
name = "reflow-rows-shrink-pushes-into-history"
expect = "match"
cols = 10
rows = 4
scrollback = 50
bytes = "l1\r\nl2\r\nl3\r\nl4"
resize = { cols = 10, rows = 2 }
note = "Rows leave the top into scrollback rather than being cut from the bottom."

[[case]]
name = "reflow-rows-grow-pulls-from-history"
expect = "match"
cols = 10
rows = 2
scrollback = 50
bytes = "l1\r\nl2\r\nl3\r\nl4"
resize = { cols = 10, rows = 4 }
note = "Growth is the inverse: the active area reclaims rows out of scrollback."

[[case]]
name = "reflow-history-reflows-at-the-new-width"
expect = "match"
cols = 10
rows = 2
scrollback = 50
bytes = "abcdefghijklmno\r\nx\r\ny\r\nz"
resize = { cols = 5, rows = 2 }
note = "Scrollback is not exempt. History rows re-split like any others, which is why the whole buffer goes through one pass."

[[case]]
name = "reflow-line-spans-history-and-active"
expect = "match"
cols = 10
rows = 2
scrollback = 50
bytes = "abcdefghijklmnopqrstuvwxyz"
resize = { cols = 5, rows = 2 }
note = "A logical line straddling the scrollback boundary is still ONE line and rejoins as one."

[[case]]
name = "reflow-alt-screen-does-not-reflow"
expect = "match"
cols = 10
rows = 3
bytes = "\u001B[?1049habcdefghijklmno"
resize = { cols = 5, rows = 3 }
note = "The ABI documents the alternate screen as not reflowing. Its rows lose columns and keep their identity."

[[case]]
name = "reflow-alt-screen-rows-shrink"
expect = "match"
cols = 10
rows = 4
bytes = "\u001B[?1049ha\r\nb\r\nc\r\nd"
resize = { cols = 10, rows = 2 }
note = "It has no scrollback, so rows leaving the top are discarded rather than kept."

[[case]]
name = "reflow-wide-cell-at-the-new-edge"
expect = "match"
cols = 10
rows = 3
bytes = "abc世界世"
resize = { cols = 6, rows = 3 }
note = "A wide cell that cannot fit before the new right edge leaves a spacer head, exactly as printing one there does."

[[case]]
name = "reflow-grapheme-cluster-survives"
expect = "match"
cols = 10
rows = 3
bytes = "abcde\u0301fghijklm"
resize = { cols = 4, rows = 3 }
note = "Combining marks travel with their cell across the re-split. A cell is not a codepoint."

[[case]]
name = "reflow-single-column"
expect = "match"
cols = 10
rows = 3
bytes = "abcde"
resize = { cols = 1, rows = 3 }
note = "The degenerate width: every character becomes its own row, and only the last three survive."

[[case]]
name = "reflow-interior-blank-rows-are-content"
expect = "match"
cols = 10
rows = 5
bytes = "a\r\n\r\n\r\nd"
resize = { cols = 10, rows = 3 }
note = "Blank rows BETWEEN content are real rows and must not be collapsed, while the trailing one is dropped."

[[case]]
name = "reflow-trailing-blank-rows-are-trimmed-first"
expect = "match"
cols = 10
rows = 4
bytes = "hi"
resize = { cols = 10, rows = 2 }
note = "Shrinking prefers to trim blank rows off the bottom over pushing content into history."

[[case]]
name = "reflow-no-op-resize"
expect = "match"
cols = 10
rows = 3
bytes = "abcdefghijklmno"
resize = { cols = 10, rows = 3 }
note = "Identical dimensions change nothing, including the wrap flags."

[[case]]
name = "reflow-resets-the-scroll-region"
expect = "match"
cols = 10
rows = 5
bytes = "\u001B[2;4r\u001B[3;1Hmid"
resize = { cols = 10, rows = 4 }
after = "\r\na\r\nb\r\nc"
note = "DECSTBM is set against a screen of a known height, so a resize resets it rather than carrying it."

[[case]]
name = "reflow-pending-wrap-at-the-real-edge"
expect = "match"
cols = 10
rows = 3
bytes = "abcdefghij"
resize = { cols = 5, rows = 3 }
after = "Z"
note = "A wrap deferred at the true last column stays deferred through the reflow, and Z proves where it resolves."

[[case]]
name = "reflow-styled-blanks-are-content"
expect = "match"
cols = 10
rows = 3
bytes = "\u001B[41mabc\u001B[K\r\nx"
resize = { cols = 5, rows = 3 }
note = "Cells carrying only a background are content, not padding: the trailing-blank trim must not eat them."

[[case]]
name = "reflow-cursor-parked-past-the-content"
expect = "match"
cols = 10
rows = 3
bytes = "ab\u001B[1;8H"
resize = { cols = 5, rows = 3 }
note = "The cursor addressed beyond the text still has to land somewhere, so the line extends to reach it."

[[case]]
name = "reflow-both-axes-at-once"
expect = "match"
cols = 5
rows = 2
scrollback = 50
bytes = "abcdefghijklmno\r\ntail"
resize = { cols = 10, rows = 4 }
note = "Width and height together, with history to reclaim."

[[case]]
name = "reflow-overflow-reaches-history-in-order"
expect = "match"
cols = 10
rows = 2
scrollback = 50
bytes = "abcdefghijklmnopqrst"
resize = { cols = 4, rows = 2 }
note = "Narrowing multiplies rows past the screen; the excess reaches scrollback oldest-first."

[[case]]
name = "reflow-cursor-above-the-rows-that-leave"
expect = "match"
cols = 10
rows = 4
scrollback = 50
bytes = "a\r\nb\r\nc\r\nd\u001B[1;1H"
resize = { cols = 10, rows = 2 }
note = "A cursor whose row is pushed above the active area cannot follow it, so it clamps to the top."

[[case]]
name = "reflow-empty-screen"
expect = "match"
cols = 10
rows = 4
bytes = ""
resize = { cols = 5, rows = 2 }
note = "Nothing written at all still has to produce a well-formed grid."

[[case]]
name = "reflow-saved-cursor-tracks-its-row"
expect = "match"
cols = 10
rows = 4
scrollback = 50
bytes = "a\r\nb\r\nc\u001B7\r\nd"
resize = { cols = 10, rows = 2 }
after = "\u001B8Q"
note = "A saved (DECSC) cursor follows its row through the resize; Q lands where DECRC put it."

[[case]]
name = "reflow-saved-cursor-above-the-active-area"
expect = "match"
cols = 10
rows = 4
bytes = "abcdefghijklmnop\u001B[1;4H\u001B7\u001B[4;1Hz"
resize = { cols = 5, rows = 4 }
after = "\u001B8Q"
note = "Its row did not survive the reflow, so the saved cursor falls back to the top-left. Upstream calls this case unspecified."

[[case]]
name = "reflow-saved-cursor-in-trailing-blanks"
expect = "diff"
cols = 10
rows = 3
bytes = "ab\r\ncdef\u001B7\u001B[3;1Hz"
resize = { cols = 5, rows = 3 }
after = "\u001B8Q"
note = "NAMED OMISSION. A saved cursor sitting in the blanks past its row's text is clamped by upstream against the column its sequential writer happens to be parked on (PageList.zig reflowRow, the p.x >= cols_len branch) -- a stale value carried from the PREVIOUS line. Measured 2026-07-28: Q lands at column 2 there and at column 4 here. Reproducing it means emulating that writer's leftover state; the adjacent upstream branch calls this whole area unspecified."

[[case]]
name = "damage-a-write-dirties-only-its-row"
expect = "diff"
cols = 10
rows = 3
damage = true
bytes = "top\r\nmiddle\r\nbottom"
after = "\u001B[1;1HX"
note = "NOT YET IMPLEMENTED, slice 5. The dirty flags are reset after `bytes`, so the damage reported is exactly what `after` changed: one cell on row 0. The core reports no damage at all yet, which is the gap this case exists to hold open."
