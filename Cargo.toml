[workspace]
resolver = "3"
members = [
    "crates/vte",
    "crates/snapshot",
    "crates/ghostty",
    "crates/core",
    "crates/frame",
    "crates/pty",
    "crates/render",
    "crates/difftest",
    "crates/abi",
    "crates/abi-types",
    "crates/host",
    "crates/mind2t",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
mind2t-vt-snapshot = { path = "crates/snapshot" }
mind2t-vt-ghostty = { path = "crates/ghostty" }
mind2t-vt-core = { path = "crates/core" }
mind2t-vt-frame = { path = "crates/frame" }
mind2t-vt-pty = { path = "crates/pty" }
mind2t-vt-render = { path = "crates/render" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
