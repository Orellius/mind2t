[package]
name = "mind2t"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# B2: the cross-platform host that will become Mind2t. It starts as a bare tao window so the
# one genuinely unproven thing - a native GPU surface living in a window this project does not
# own - is isolated from everything else. The webview, and then Tauri itself, come after.
#
# Links mind2t-vt-host as a RUST crate, not through the C ABI. The C surface exists for the
# Swift host and for outside embedders; our own app has no reason to cross a foreign-function
# boundary to reach its own workspace.
[dependencies]
mind2t-vt-host = { path = "../host", version = "0.1.0" }
# For `BaseDirection` alone: the Hebrew-first setting is a layout preference the host applies to
# a session, and naming it requires the type that defines it.
mind2t-vt-frame = { path = "../frame", version = "0.1.0" }
mind2t-vt-render.workspace = true
# The key encoder lives here and is corpus-pinned against the oracle. Reaching for it directly
# rather than through the host keeps one encoder in the project instead of a second mapping
# written for this window (the Swift host's `KeyMap.swift` is the same encoder's other caller).
mind2t-vt-pty = { path = "../pty", version = "0.1.0" }
tao = "0.35"
# B2.2. The chrome layer, and the only browser engine in the project - it draws documents, never
# terminal pixels (the "no terminal bytes in the webview" law). It is WKWebView on macOS, which
# is already linked by the Swift host's panels, so this adds a Rust binding rather than a second
# engine. Same `raw-window-handle` 0.6 as tao, so the child-window handle crosses without a shim.
wry = "0.56"
# B2.2, and it is a FINDING rather than a convenience. A WKWebView performs cmd+A / cmd+C /
# cmd+V through the menu key-equivalent path, so an app with no Edit menu receives the keydown
# and does nothing with it - measured live on 2026-08-04, not inferred. muda is the menu crate
# Tauri 2 itself depends on, so this is the path B2.3 lands on anyway rather than a detour.
muda = "0.19"
# B2.4. The shell, on Orel's decision (2026-08-04). `unstable` is REQUIRED and is not optional
# polish: it is what exposes `Window::add_child`, the only way to create a window BEFORE its
# webview - and B2.2 measured that a wgpu surface created after the webview lands on top of it.
tauri = { version = "2.11", features = ["unstable"] }
# Only for the chrome payload struct; the terminal side crosses no serialization boundary.
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# T2b. The Linux key source, and the justification the no-new-dependencies rule asks for: this
# is not a choice between libraries, it is the only way to name a type we are already handed.
# `tauri::Window::gtk_window()` RETURNS a `gtk::ApplicationWindow`; without the crate we cannot
# name that type, let alone connect a signal to it. It is already in the tree - Cargo.lock has
# gtk 0.18.2 and gdk 0.18.2, pulled by tauri itself - so this adds a path, not a package, and
# the version is pinned to the one already resolved because a second major would give us a
# DIFFERENT `ApplicationWindow` type than the one tauri hands back.
#
# Linux only, not the BSDs. `gtk_window()` is available on dragonfly, freebsd, netbsd and
# openbsd too; the plan's stated scope is macOS and Linux, and claiming a platform nothing has
# ever built for is the kind of claim this file exists to stop.
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# T1, 2026-08-08. These two were in the portable `[dependencies]` table until now, which is why
# `cargo tree -p mind2t --target x86_64-unknown-linux-gnu` resolved `block2` and `objc2` for a
# Linux build and the crate could not compile off macOS at all. Every USE of them was already
# behind `#[cfg(target_os = "macos")]`; the manifest was the only thing that was not, and a
# dependency table is not covered by any cfg the source carries.
#
# They are still here rather than deleted: the AppKit event monitor (`mod input` in main.rs) is
# the macOS key and mouse source until T2 finds a portable one, and `mod input` reads raw
# `NSEvent` through `objc2` and installs its handler as a `block2::RcBlock`.
block2 = "0.6"
objc2 = "0.6"
# Already in the tree under wry and muda, so this is a direct path to NSPasteboard. Feature-scoped
# rather than default: the default set pulls objc2-core-video, which a clipboard read has no use
# for. Reading the clipboard is the HOST's job - the terminal core does no I/O.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSPasteboard",
    "NSEvent",
    "NSResponder",
    "NSApplication",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
