<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Mind2t - the app mark. Orel's pick, 2026-08-08, after twelve rejected attempts. It is worth
    recording what those attempts ruled OUT, because every one of them died for a structural
    reason and the next person to open this file will otherwise try them again:

    - LETTERS CENTRED ON A PLATE, in any weight or colour, was rejected outright as a pattern.
    - A HAIRLINE T BETWEEN THE M AND THE 2 spells MT2. Reading order is not negotiable.
    - A NEGATIVE-SPACE T in the gap between the M and the 2 cannot work: a 2's left side is not a
      straight wall, so the channel widens in the middle and stops being a stem.
    - SQUARING THE M'S NOTCH to make that channel uniform turns the M into an H.
    - THE FAIRGAMES TRICK (one stroke weight, the second letter built from strokes the first
      already needed) works there because the G ENCLOSES the F. Nothing in M2T encloses anything,
      and at the weight an M needs, its three counters fuse.

    WHAT THIS MARK DOES INSTEAD. The M is drawn as one polyline in a single heavy stroke, and the
    T is the crossbar cutting across its two stems - the same shared-stroke idea, but the T is
    made of ONE stroke the M did not already have rather than several. The 2 sits in the M's
    central counter.

    THE FENCE IS THE LOAD-BEARING PART. The M's counter is a downward-pointing triangle and a 2 is
    bottom-heavy, so the glyph's bottom bar collides with the diagonals no matter how it is
    placed - that is why the two earlier "2 in the middle" versions failed. The 2 is therefore
    drawn TWICE: once at stroke 150 in the plate's own colour, which carves a clearance around it,
    and once at stroke 70 in white. The dark pass is not a shadow and not decoration; without it
    the 2 is unreadable at any size.

    The fence uses the SAME gradient object as the plate, in userSpaceOnUse coordinates. A flat
    fill would be a visible patch, because the plate is a gradient and the fence sits two thirds
    of the way down it. Sharing one gradient in user space makes them identical by construction
    rather than by a matched pair of numbers somebody has to keep in step.

    KNOWN COST, stated rather than discovered: the crossbar cuts the M's diagonals, so the M reads
    as a crown before it reads as a letter. Orel saw that and chose this anyway.

    Colour is the terminal's own, from crates/render/src/color.rs: ground #0d0d0d
    (default_background) under the same #1e1e1e lift the plate has always had, ink #ffffff
    (default_foreground). No third hue.

    Regenerate BOTH raster copies and the platform set after any edit; nothing does it
    automatically:
      rsvg-convert -w 1024 -h 1024 assets/icon/mind2t.svg -o assets/icon/mind2t-1024.png
      cp assets/icon/mind2t-1024.png crates/mind2t/icons/icon.png
      (cd crates/mind2t && cargo tauri icon ../../assets/icon/mind2t-1024.png -o icons)
    And judge at 32, which is what the Dock draws:
      rsvg-convert -w 32 assets/icon/mind2t.svg | magick - -filter point -resize 900% out.png
  -->
  <defs>
    <!--
      userSpaceOnUse, spanning the plate exactly, so the fence below can share it.

      FULL BLACK on Orel's word, 2026-08-08. It was #1e1e1e to #0b0b0b; it now bottoms out at
      pure #000000 with only enough lift at the top to keep it a gradient rather than a flat
      fill. The fence around the 2 follows automatically, because it strokes THIS gradient
      object in user space - a flat fence colour would have had to be changed here too.

      NO RIM STROKE (Orel's order, 2026-08-09: match T3 Code's plate - flat black, no border).
      A white rim highlight used to carry the silhouette on dark backgrounds; removed rather
      than kept "just in case", because an unused gradient def is exactly the dead-code smell
      this file already warns against re-adding.
    -->
    <linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="960">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#ground)"/>

  <!--
    The M and the T, one weight. The M is a single polyline so its stems and diagonals cannot
    drift apart; the crossbar spans both stems at y=330, which is where a T's arm sits relative
    to a cap height of 210..856.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="104" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M156 856 L156 210 L512 690 L868 210 L868 856"/>
    <path d="M156 330 L868 330"/>
  </g>

  <!-- The clearance. Same path, plate colour, wider stroke. See the card above. -->
  <path d="M414 500 C414 462 442 436 480 436 C520 436 548 460 548 498
           C548 528 526 546 490 574 L414 640 L556 640"
        fill="none" stroke="url(#ground)" stroke-width="150" stroke-linejoin="round"/>
  <!-- The 2 itself. -->
  <path d="M414 500 C414 462 442 436 480 436 C520 436 548 460 548 498
           C548 528 526 546 490 574 L414 640 L556 640"
        fill="none" stroke="#ffffff" stroke-width="70" stroke-linejoin="round"/>
</svg>
