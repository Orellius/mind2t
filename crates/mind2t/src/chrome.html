<!doctype html>
<!--
  B2.2 chrome probe. Not a design - a fixture.

  STRIPPED 2026-08-08 on Orel's word: the "tap me" button, the text input and its echo span are
  gone, with their click, input and IME-composition handlers. They were B2.2's measurement of
  WHERE INPUT LANDS when a transparent webview sits over a GPU surface, and that question is
  answered - the terminal's keys come from AppKit and GTK, never from a webview, which is
  project law 2. A fixture that keeps measuring a settled question is just something on screen.

  What survives is what is still being measured: the bar (does the webview draw at all), the
  marker and its caption (does it composite OVER the surface), and the mousedown/keydown taps
  (does input reach the page at all). Only `probe.rs` includes this file.

  Three things on this page are load-bearing and none of them are decoration:

  - `background: transparent` on html and body. A webview that composites correctly but paints
    an opaque white page looks exactly like a webview drawn on top of nothing, and the terminal
    underneath is equally invisible either way.
  - The MARKER overlaps the GPU pattern's green bar on purpose, at 75% alpha. Above the surface
    it tints the bar; below it, it is gone. A marker drawn over empty background could not tell
    those apart.
  - Every input event is reported over IPC. Where a click or a keystroke LANDS is the question
    this slice exists to answer, so nothing here may swallow an event quietly.
-->
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font: 13px ui-monospace, Menlo, monospace;
    color: #e8e8ef;
    /* The page must never scroll: a scrollbar would be an opaque strip nobody asked for, and it
       would move the marker away from the bar it has to overlap. */
    overflow: hidden;
  }

  #bar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 44px;
    padding: 0 12px;
    box-sizing: border-box;
    background: rgba(16, 16, 22, 0.92);
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  }

  #bar strong { letter-spacing: 0.08em; font-weight: 600; }

  button, input {
    font: inherit;
    color: inherit;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 5px;
    padding: 4px 10px;
  }

  input { width: 260px; }
  input:focus, button:focus { outline: 2px solid #d63384; outline-offset: 1px; }

  #marker {
    position: absolute;
    left: 320px;
    top: 220px;
    width: 60px;
    height: 60px;
    box-sizing: border-box;
    background: rgba(230, 60, 200, 0.75);
    border: 2px solid #ffffff;
  }

  #caption {
    position: absolute;
    left: 320px;
    top: 288px;
    text-shadow: 0 1px 2px #000;
  }
</style>

<div id="bar">
  <strong>MIND2T</strong>
</div>

<div id="marker"></div>
<div id="caption">webview marker - must tint the green bar</div>

<script>
  const send = (message) => window.ipc.postMessage(JSON.stringify(message));

  const where = (event) => ({
    x: Math.round(event.clientX),
    y: Math.round(event.clientY),
    on: event.target.id || event.target.tagName.toLowerCase(),
  });

  // Capture phase, on the window: a listener on an element would miss clicks that land on the
  // transparent region, which is the interesting half of the measurement.
  addEventListener('mousedown', (e) => send({ ch: 'webview', kind: 'mousedown', ...where(e) }), true);
  addEventListener('keydown', (e) => send({ ch: 'webview', kind: 'keydown', key: e.key, code: e.code }), true);

  send({ ch: 'webview', kind: 'ready' });
</script>
