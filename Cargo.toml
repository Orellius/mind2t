[workspace]
resolver = "3"
members = [
    "crates/snapshot",
    "crates/ghostty",
    "crates/core",
    "crates/difftest",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
ruuah-vt-snapshot = { path = "crates/snapshot" }
ruuah-vt-ghostty = { path = "crates/ghostty" }
ruuah-vt-core = { path = "crates/core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
