[package]
name = "mind2t-vt-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The mind2t-vt terminal core: bytes in, grid mutations out. No pty, no GPU, no clock, no I/O."

[dependencies]
mind2t-vt-snapshot.workspace = true
unicode-width = "0.2"
vte = { package = "mind2t-vt-vte", path = "../vte", version = "0.15.0" }
# Kitty graphics f=100: icat's default wire format is PNG. Weighed under GATE 01 --
# decode is pure/deterministic and the protocol is unusable without it.
png = "0.17"
