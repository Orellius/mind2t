[package]
name = "mind2t-vt-ghostty"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# NEVER publishable: build.rs links libghostty-vt, built from a local Ghostty checkout via
# MIND2T_VT_ORACLE_SRC. It cannot build on docs.rs or on anyone else's machine, and it is a
# test oracle rather than a library anyone would consume.
publish = false

[dependencies]
mind2t-vt-snapshot.workspace = true
thiserror.workspace = true

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
mind2t-vt-abi-types = { path = "../abi-types", version = "0.1.0" }
mind2t-vt-core.workspace = true
mind2t-vt-pty.workspace = true
serde_json = "1"
