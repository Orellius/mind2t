# Pin the target dir LOCALLY, overriding the machine-global studio-cache
# redirect in ~/.cargo/config.toml (closer config wins). This repo cannot use
# the shared root: swift/Package.swift links the staticlib by literal path
# (-L../target/release), and the differential-oracle scripts reference
# ./target/debug. Remove this pin only after those paths are made
# CARGO_TARGET_DIR-aware.
[build]
target-dir = "target"
